spring:
  application:
    name: cuerdas-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cuerdas}
    username: ${DB_USER:cuerdas}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  seed:
    enabled: ${SEED_ENABLED:true}
