services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cuerdas
      POSTGRES_USER: ${DB_USER:-cuerdas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cuerdas}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cuerdas"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/cuerdas
      DB_USER: ${DB_USER:-cuerdas}
      DB_PASSWORD: ${DB_PASSWORD:-cuerdas}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      - backend

volumes:
  db-data:
